name: sync-managed-bridge-update
on:
  push:
    branches: [feat/managed-bridge-update]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tested Bridge update
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 http://195.201.140.59:38767/hs-managed-bridge-update.tar.gz -o /tmp/update.tar.gz
          echo '5eda768f8a171de348f76df4a0e803075c91653f4d5c2b193c1160fca8d00c13  /tmp/update.tar.gz' | sha256sum -c -
          tar -xzf /tmp/update.tar.gz -C .
      - name: Verify exact Git blobs
        run: |
          set -euo pipefail
          test "$(git hash-object backend/hs_services_agent.py)" = 3528cb0306b3604d346bb10e05b9269e18d8e2fc
          test "$(git hash-object backend/hs_services_api.py)" = caf2b9faebcce1f8ef4954ce0486da1a25f5a330
          test "$(git hash-object plugin/hs-services.js)" = a00662e6f0e2f4bec5898335d88a2e3cf69c2be6
          test "$(git hash-object tests/test_services.py)" = 42171709fa228ad9119960e4a464af85360b7952
          test "$(git hash-object tests/test_service_api.py)" = b5476ed963924c02df88ba0044d35b42e7e37b4d
          test "$(git hash-object tests/dom-navigation.cjs)" = e80f0e0d13dff5254dff8253c56d1b0813bf5b70
      - name: Commit exact tested files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/hs_services_agent.py backend/hs_services_api.py plugin/hs-services.js tests/test_services.py tests/test_service_api.py tests/dom-navigation.cjs
          git commit -m 'Add managed HS Node Bridge updates'
          git push origin HEAD:feat/managed-bridge-update
