name: sync-node-pro-093
on:
  push:
    branches: [fix/node-pro-block-centering]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply tested Node PRO patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gunzip > /tmp/node-pro-093.patch
          git apply --check /tmp/node-pro-093.patch
          git apply /tmp/node-pro-093.patch
          git rm .github/workflows/sync-node-pro-093.yml
          git config user.name PEDIHS
          git config user.email 130468444+PEDIHS@users.noreply.github.com
          git add plugin/hs-node-pro.js tests/node-pro-card.cjs
          git commit -m 'Center Node PRO block inside Node card'
          git push origin HEAD:${GITHUB_REF_NAME}
