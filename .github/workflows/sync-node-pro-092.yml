name: sync-node-pro-092
on:
  push:
    branches:
      - fix/node-pro-center-perf
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/node-pro-center-perf
      - name: Apply optimized Node PRO patch
        shell: bash
        run: |
          cat <<'B64' | base64 -d | gzip -d > /tmp/nodepro.patch
          
          B64
          git apply --index /tmp/nodepro.patch
          git rm .github/workflows/sync-node-pro-092.yml
          git config user.name PEDIHS
          git config user.email 130468444+PEDIHS@users.noreply.github.com
          git commit -m 'Center realtime badge and optimize Node PRO rendering'
          git push origin HEAD:fix/node-pro-center-perf
