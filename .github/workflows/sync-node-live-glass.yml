name: sync-node-live-glass
on:
  push:
    branches: [feat/node-live-glass]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested Node PRO patch
        shell: bash
        run: |
          git apply --index sync/node-live.patch
          git rm sync/node-live.patch .github/workflows/sync-node-live-glass.yml
          git config user.name PEDIHS
          git config user.email 130468444+PEDIHS@users.noreply.github.com
          git commit -m "Add compact live RX TX Node cards"
          git push origin HEAD:feat/node-live-glass
