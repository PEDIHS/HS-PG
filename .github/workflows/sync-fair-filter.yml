name: sync-fair-filter
on:
  push:
    branches: [fix/user-fair-filter-refresh]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-fair-filter-refresh
          fetch-depth: 0
      - name: Apply verified Fair Use filter fix
        run: |
          curl -fkSs --retry 3 --connect-timeout 10 'https://panel.pedramhs.ir:8443/statics/hs-fair-filter-fix.patch' -o /tmp/fair-filter-fix.patch
          echo '117038e2eda756ec237dbd2b64ca7ae8f32fadbca5d43143d1abc2d2c7cc9572  /tmp/fair-filter-fix.patch' | sha256sum -c -
          git apply --check /tmp/fair-filter-fix.patch
          git apply /tmp/fair-filter-fix.patch
          rm -f .sync/fair-filter-*.b64 .github/workflows/sync-fair-filter.yml
          git config user.name PEDIHS
          git config user.email 130468444+PEDIHS@users.noreply.github.com
          git add -A
          git commit -m 'Fix Fair Use user filtering and refresh targeting'
          git push
