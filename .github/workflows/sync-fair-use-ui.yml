name: sync-fair-use-ui-fix
on:
  push:
    branches: [fix/fair-use-group-ui]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tested UI fix
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 http://195.201.140.59:38766/hs-group-ui-fix.tar.gz -o /tmp/hs-group-ui-fix.tar.gz
          echo 'b33b4cf6e352a70c330087feb3e936a562ed05166bb1461a1010f62d7147b167  /tmp/hs-group-ui-fix.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hs-group-ui-fix.tar.gz -C .
      - name: Verify exact blobs
        run: |
          set -euo pipefail
          test "$(git hash-object plugin/hs-host-fair.js)" = cdf13ede72ed1577a6d109c3c5e8fc2ed0abf8ea
          test "$(git hash-object tests/dom-navigation.cjs)" = 809bc80df2e6cd867f3f057271d5f97f6fbad092
          test "$(git hash-object tests/ui-navigation.cjs)" = 13bd46183cea5e1f14a55e82e444a764f339d30a
      - name: Commit exact tested UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin/hs-host-fair.js tests/dom-navigation.cjs tests/ui-navigation.cjs
          git commit -m 'Fix Fair Use Group scrolling and toggle state'
          git push origin HEAD:fix/fair-use-group-ui
