name: sync-host-groups-fair-status
on:
  push:
    branches: [feat/host-groups-fair-status]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact tested tree
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 http://195.201.140.59:38768/hs-host-groups-fair-status.tar.gz -o /tmp/update.tar.gz
          echo 'e724327a04315a368ac0cef18690e2e78d3cd9193d040abb9cf5f0a8e0a55a46  /tmp/update.tar.gz' | sha256sum -c -
          tar -xzf /tmp/update.tar.gz -C .
      - name: Verify exact Git blobs
        run: |
          set -euo pipefail
          test "$(git hash-object backend/hs_fair_runtime.py)" = 8657d1ea7c2958386e9154d4488af26855ab5dba
          test "$(git hash-object backend/hs_services_api.py)" = 7f7dfbd26f8dcbac60bc3e8f8a4dcb2099b94530
          test "$(git hash-object plugin/hs-host-fair.js)" = 4b4de04956299d5e2b06f3a07fff3fed4dab4085
          test "$(git hash-object tests/dom-navigation.cjs)" = d495d8bcd572d64205e621058299dc9a9f8b4ecd
          test "$(git hash-object tests/test_fair_api.py)" = 44371db9f9d569ac12f3a151dc96a048f8d97c1e
          test "$(git hash-object tests/test_native_integration.py)" = 95c78c5eb2570ad21726c4887382400c308de793
      - name: Commit exact tested files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/hs_fair_runtime.py backend/hs_services_api.py plugin/hs-host-fair.js tests/dom-navigation.cjs tests/test_fair_api.py tests/test_native_integration.py
          git commit -m 'Add Host group categories and native Fair limited status'
          git push origin HEAD:feat/host-groups-fair-status
