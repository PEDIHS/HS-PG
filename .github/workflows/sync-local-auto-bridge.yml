name: sync-local-auto-bridge
on:
  push:
    branches: [feat/local-auto-bridge]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact tested tree
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 http://195.201.140.59:38767/hs-local-auto-bridge.tar.gz -o /tmp/hs-local-auto-bridge.tar.gz
          echo '5ee608a005cc57eea826634678fc90e8c66cf0300e6d2c1c7f6a554e0eda2085  /tmp/hs-local-auto-bridge.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hs-local-auto-bridge.tar.gz -C .
      - name: Verify exact blobs
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = 80911965bcd073d6e0b359fe1271a4bb9d3768ef
          test "$(git hash-object backend/hs_local_bridge.py)" = aed49ba7fe35eb94096cf92e126ccd1234c73d93
          test "$(git hash-object backend/hs_services_agent.py)" = b9412790503a3867039c14da626ab8afbc28ba13
          test "$(git hash-object backend/hs_services_api.py)" = fbbd0697d3ce779691370379dbf6f0a0c7f94cab
          test "$(git hash-object docs/hs-services.md)" = 9b4764811d00034b7291f6185d7e1125fc182e35
          test "$(git hash-object install.sh)" = e09bd2e39695d2be79c9d0a824505c92d63cbcd0
          test "$(git hash-object plugin/hs-services.js)" = a786e5457334367f6f08d69fb196d9d0622c78ec
          test "$(git hash-object plugin/integrate-services.sh)" = f7facc2f675784f8eb3598aab8b2f3d04a856442
          test "$(git hash-object plugin/patch_services_api.py)" = 55a3e23de1caabf3174bc52ce77cdd773692b5a3
          test "$(git hash-object tests/test_service_api.py)" = 1890d8df5820317f14757ac5787be80f89f8a765
          test "$(git hash-object tests/test_services.py)" = b96088312343cad30314a027f4b0978efae4e870
      - name: Commit exact tested tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md backend/hs_local_bridge.py backend/hs_services_agent.py backend/hs_services_api.py docs/hs-services.md install.sh plugin/hs-services.js plugin/integrate-services.sh plugin/patch_services_api.py tests/test_service_api.py tests/test_services.py
          git commit -m 'Add local auto bridge for panel-hosted nodes'
          git push origin HEAD:feat/local-auto-bridge
