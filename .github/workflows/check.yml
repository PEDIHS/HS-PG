name: check
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and behavior checks
        run: |
          python -m py_compile backend/*.py plugin/patch_pasarguard.py plugin/patch_backup_api.py tests/*.py
          python tests/test_runtime.py
          python tests/test_patcher.py
          python tests/test_backup_agent.py
          node --check plugin/hs-plugin.js
          node --check plugin/hs-tab-fix.js
          node --check plugin/hs-node-pro.js
          node --check plugin/hs-backup.js
          node --check plugin/hs-backup-tab-watchdog.js
          node --check plugin/hs-admin-time.js
          bash -n install.sh cli/hs-pg plugin/integrate-dashboard.sh