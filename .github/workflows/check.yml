name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r tests/requirements.txt
      - name: Backend and API regression
        run: |
          python -m compileall -q backend plugin tests
          python -m pytest -q
          for file in plugin/*.js; do node --check "$file"; done
          bash -n install.sh cli/hs-pg plugin/*.sh
      - name: DOM and browser regression
        run: |
          npm ci --prefix tests
          npm --prefix tests run test:dom
          cd tests
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: nftables syntax in isolated network namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables
          sudo python tests/nft_preflight.py
