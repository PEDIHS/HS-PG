name: sync-fair-native-ux
on:
  push:
    branches: [fix/fair-use-native-ux]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested UI patch
        shell: bash
        run: |
          cat .sync/fair-ui-part-*.patch > /tmp/fair-ui.patch
          git apply --check /tmp/fair-ui.patch
          git apply --index /tmp/fair-ui.patch
          git rm .sync/fair-ui-part-*.patch .github/workflows/sync-fair-native-ux.yml
          git config user.name PEDIHS
          git config user.email 130468444+PEDIHS@users.noreply.github.com
          git commit -m "Polish Fair Use native UX"
          git push origin HEAD:fix/fair-use-native-ux
