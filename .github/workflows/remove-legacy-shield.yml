name: remove-legacy-shield-artifact
on:
  push:
    branches: [fix/remove-legacy-shield-artifact]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy artifact
        run: |
          set -euo pipefail
          sed -i '/plugin\/integrate-shield\.sh/d' install.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('plugin/retire-firewall.sh')
          s=p.read_text()
          old='plugin/patch_extensions.py plugin/patch_shield_api.py;'
          new='plugin/patch_extensions.py plugin/patch_shield_api.py plugin/integrate-shield.sh;'
          if old not in s:
              raise SystemExit('retirement anchor missing')
          p.write_text(s.replace(old,new))
          PY
          git rm plugin/integrate-shield.sh
          bash -n install.sh plugin/retire-firewall.sh
          test ! -e plugin/integrate-shield.sh
          test "$(grep -RIl 'integrate-shield' install.sh plugin 2>/dev/null | tr '\n' ' ')" = "plugin/retire-firewall.sh "
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove legacy Shield compatibility artifact'
          git push origin HEAD:fix/remove-legacy-shield-artifact
