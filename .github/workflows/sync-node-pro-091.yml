name: sync-node-pro-091
on:
  push:
    branches: [fix/node-pro-alignment]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested Node PRO alignment patch
        shell: bash
        run: |
          git apply --index .sync/node-pro-091.patch
          git rm .sync/node-pro-091.patch .github/workflows/sync-node-pro-091.yml
          git config user.name PEDIHS
          git config user.email 130468444+PEDIHS@users.noreply.github.com
          git commit -m "Fix Node PRO realtime alignment and chart overlap"
          git push origin HEAD:fix/node-pro-alignment
