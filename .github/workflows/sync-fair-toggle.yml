name: sync-fair-toggle
on:
  push:
    branches: [fix/fair-use-native-ux]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested Fair Use patch
        shell: bash
        run: |
          cat .sync/fair-toggle-*.patch > /tmp/fair-toggle.patch
          git apply --check /tmp/fair-toggle.patch
          git apply --index /tmp/fair-toggle.patch
          git rm .sync/fair-toggle-*.patch .github/workflows/sync-fair-toggle.yml
          git config user.name PEDIHS
          git config user.email 130468444+PEDIHS@users.noreply.github.com
          git commit -m "Match Fair Use Users toggle and split status"
          git push origin HEAD:fix/fair-use-native-ux
